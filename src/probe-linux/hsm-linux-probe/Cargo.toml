[package]
name = "hsm-linux-probe"
description = "Linux host probe that reports Debian host metrics into HSM through the native collector."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hsm-linux-probe"
path = "src/main.rs"

[features]
default = []
# Enables the collector's Linux default sensors. Off until #1414 is merged and released; the probe
# logs a warning and runs with probe-added sensors only while it is off.
linux-default-sensors = ["hsm-collector/linux-default-sensors"]

[dependencies]
hsm-collector = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
