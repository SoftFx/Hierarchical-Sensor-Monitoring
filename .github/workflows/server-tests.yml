name: Server tests

# The server test projects of HSMServer.sln (HSMServer.Core.Tests, HSMDatabase.LevelDB.Tests,
# HSMDatabase.SealedHistory.Tests, HSMTableBlocks.Tests) on every pull request. Before this lane they ran
# only inside the release build (server-build.yml, push to master/develop), so a red server test showed up
# after the merge. #1943 made the run short enough for a pull request; server-build.yml keeps its own run.
# The test steps mirror the "build" job of server-build.yml: same runner, SDK, Node, restore and test
# command (Node because building HSMServer runs its webpack bundle).

# No paths filter on pull_request: a path-filtered check never reports on other PRs, so it could
# not be made a required check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: src/server/HSMServer/HSMServer.sln

jobs:
  server-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # --blame-crash: a test host that dies (an access violation in native code, a stack overflow, a
      # fail-fast) leaves a mini dump and the Sequence_*.xml of the tests it was running next to the trx
      # files, so the upload below carries them.
      - name: Build & Test Solution
        run: >
          dotnet test ${{ env.SOLUTION_PATH }} --no-restore -c Release
          --logger "console;verbosity=minimal"
          --logger trx
          --blame-crash --blame-crash-dump-type mini
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # #1791: the LevelDB tests on a really full volume (LevelDbDiskFullTests), which only a Linux runner can give them: a
  # 4 MB tmpfs the tests fill. They are skipped in the job above (no HSM_TEST_SMALL_VOLUME there). Node because the test
  # project builds HSMServer (through HSMServer.Core.Tests), which runs its webpack bundle.
  disk-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mount a small volume
        run: |
          sudo mkdir -p /mnt/hsm-small
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs /mnt/hsm-small
          df -h /mnt/hsm-small

      - name: Disk-full tests
        env:
          HSM_TEST_SMALL_VOLUME: /mnt/hsm-small
        run: >
          dotnet test src/tests/HSMDatabase.LevelDB.Tests -c Debug
          --filter "FullyQualifiedName~LevelDbDiskFullTests"
          --logger "console;verbosity=normal"
