name: Collector nuget build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nuget:
    runs-on: ubuntu-latest
    environment: Nuget
    permissions:
      contents: read
      id-token: write # OIDC token for nuget.org Trusted Publishing
    env:
      SolutionPath: src/collector/HSMDataCollector.sln
      CollectorPath: src/collector/HSMDataCollector/HSMDataCollector.csproj
      OutputFolder: ${{ github.workspace }}/BuildOutput
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore ${{ env.SolutionPath }}

      - name: Build Solution
        run: dotnet build ${{ env.SolutionPath }} -c Release --no-restore

      - name: Pack collector
        run: dotnet pack ${{ env.CollectorPath }} -c Release -o ${{ env.OutputFolder }}

      # Exchanges the job's GitHub OIDC token for a short-lived nuget.org API key.
      # Requires a Trusted Publishing policy on nuget.org (owner: SoftFx,
      # repo: Hierarchical-Sensor-Monitoring, workflow: collector-nuget-build.yml,
      # environment: Nuget) owned by the nuget.org user in vars.NUGET_USER.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push nuget
        run: dotnet nuget push ${{ env.OutputFolder }}/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  create-tag:
    # Tag the release only after the NuGet push has succeeded, so a failed build
    # never plants a baseline tag that the next /release-collector run would
    # treat as the previous release. Mirrors the server-build.yml pattern.
    needs: build-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the collector-v* tag
    steps:
      - uses: actions/checkout@v4

      - name: Read version from csproj
        id: read-version
        shell: bash
        run: |
          set -euo pipefail
          csproj="src/collector/HSMDataCollector/HSMDataCollector.csproj"
          version=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -1 | tr -d ' \r\n')
          if [ -z "$version" ]; then
            echo "::error::could not extract <Version> from $csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=collector-v$version" >> "$GITHUB_OUTPUT"

      - name: Push tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.read-version.outputs.tag }}
          message: "Release HSMDataCollector ${{ steps.read-version.outputs.version }}"
