name: HSM Caddy image

on:
  push:
    branches: [master]
    paths:
      - caddy/**
      - .github/workflows/caddy-image.yml
  pull_request:
    paths:
      - caddy/**
      - docker-compose.yml
      - .env.example
      - wiki-git/Installation.md
      - aicontext/architecture/docker.md
      - docs/decisions/0007-bundled-dns-caddy-image.md
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: hsmonitoring/hsm-caddy
  VERSION: 2.11.4-1

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for runtime tests
        run: docker build --tag hsm-caddy:test caddy

      - name: Test modules, modes, validation, and secret handling
        run: sh caddy/test.sh hsm-caddy:test

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUBUSERNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Publish tested image
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker tag hsm-caddy:test "$IMAGE:$VERSION"
          docker tag hsm-caddy:test "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"