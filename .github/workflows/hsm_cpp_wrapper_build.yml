name: hsm-wrapper-build

# Builds the native HSMCppWrapper.dll (pure C++ over hsm::collector — no CLR) and runs the
# in-process ABI smoke. Replaces the former C++/CLI MSBuild lane.

on:
  push:
    branches:
      - master
      - hsm-cpp-wrapper
    paths:
      - 'src/wrapper/**'
      - 'src/native/collector/**'
      - '.github/workflows/hsm_cpp_wrapper_build.yml'
  pull_request:
    # ready_for_review is required so the build runs when a draft is marked ready
    # (marking ready does not emit a synchronize event).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/wrapper/**'
      - 'src/native/collector/**'
      - '.github/workflows/hsm_cpp_wrapper_build.yml'

  workflow_dispatch:

jobs:
  build:
    # Skip on draft PRs only. Non-PR events (push/workflow_dispatch) have no
    # pull_request payload, so they must still run — hence the event_name guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: windows-latest
    env:
      VCPKG_DISABLE_METRICS: '1'

    steps:
      - uses: actions/checkout@v4

      # Dependencies come from vcpkg manifest mode (src/wrapper/vcpkg.json): curl with WebSocket (the
      # collector session needs libcurl 8.14.0 or newer with it), zstd and zlib (table sensors).
      # Pinned to the manifest's builtin-baseline, as the native-collector lanes are, so the runner's
      # own vcpkg never decides which curl the wrapper ships.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Configure
        # No -G: use the runner's default (multi-config VS) generator — pinning a VS version breaks
        # when the image upgrades Visual Studio (same approach as the native-collector lanes).
        # The vcpkg manifest install runs here. VCPKG_BINARY_SOURCES=clear for the same reason as in
        # native-collector-conformance.yml: run-vcpkg's default GHA cache backend needs tokens that
        # are not reliably exported, which fails the install.
        env:
          VCPKG_BINARY_SOURCES: clear
        run: >
          cmake -S src/wrapper -B build/wrapper
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build/wrapper --config Release
        shell: cmd

      - name: Smoke (drive the public ABI in-process, no server needed)
        # vcpkg's app-local deployment put libcurl, zlib and zstd next to the DLL.
        run: |
          set "PATH=%CD%\build\wrapper\Release;%PATH%"
          build\wrapper\Release\WrapperConsole.exe
        shell: cmd

      # The exported API against scripted servers (#1848 part 5): the default transport is the
      # collector session, UseHttpTransport() sends over HTTP with no upgrade, a table sensor made
      # through Native() delivers on the session and is Unavailable on HTTP.
      - name: Transport tests
        run: ctest --test-dir build/wrapper -C Release --output-on-failure
        shell: cmd
