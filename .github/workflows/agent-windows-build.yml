name: HSM Agent build (Windows)

# Builds the HSM Agent (src/agent) — the always-on Windows service that hosts the native collector
# (epic #1167). The agent links the in-tree collector with the libcurl HTTP transport, so it builds
# only on Windows with vcpkg (curl). The lane:
#   - configures + builds src/agent in Release with warnings-as-errors,
#   - runs the portable config-parser ctest suite,
#   - stages the publishable bundle payload (hsm-agent.exe + config.json template + install scripts)
#     and uploads it as an artifact. The server's per-product download (W6/W7) consumes hsm-agent.exe
#     (wiring the artifact into the server image is the release step, W9). The exe is unsigned here;
#     code-signing is a later release step.

on:
  push:
    branches: [master, develop]
    paths:
      - 'src/agent/**'
      - '.github/workflows/agent-windows-build.yml'
  pull_request:
    # ready_for_review so the lane runs when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/agent/**'
      - '.github/workflows/agent-windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    # Skip on draft PRs; non-PR events have no pull_request payload, so they still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4

      # Pinned to the agent vcpkg.json builtin-baseline so the curl manifest resolves deterministically.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Configure (Release, HTTP transport on)
        # The agent CMake forces HSM_COLLECTOR_HTTP=ON on Windows AND the x64-windows-static triplet +
        # static CRT, so the produced hsm-agent.exe is a self-contained single binary (no libcurl/zlib
        # DLLs). vcpkg manifest install (static curl[ssl]=Schannel + zlib) runs at configure time.
        # Override VCPKG_BINARY_SOURCES to "clear" so the GHA cache backend (whose tokens aren't
        # reliably exported) is not used — curl builds from source. Same fix the collector lane uses.
        env:
          VCPKG_BINARY_SOURCES: clear
        run: >
          cmake -S src/agent -B build/agent
          -DHSM_AGENT_WERROR=ON
          -DHSM_COLLECTOR_WERROR=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build/agent --config Release --parallel

      - name: Test (config parser)
        run: ctest --test-dir build/agent -C Release --output-on-failure

      # Service smoke (W9): the GitHub windows runner is admin, so exercise the real SCM lifecycle —
      # --install registers an auto-start service, --uninstall removes it — and a short --console run
      # proves the worker survives an unreachable server (no crash) instead of exiting.
      # Data-dir ACL (#1279): the runner first gets a pre-#1279 data dir (plain mkdir, so it inherits
      # BUILTIN\Users read from %ProgramData%, owner set to a non-admin) holding a config.json; --install
      # must tighten it in place to SYSTEM + Administrators, owned by Administrators, keep the config
      # byte-identical, and a wide ACE fails the lane. agent-release.yml runs the same step body.
      - name: Service install / console smoke
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse -Path build/agent -Filter hsm-agent.exe | Select-Object -First 1).FullName
          Write-Host "smoke exe: $exe"

          # Wide principals by name (English runner) and by SID: Users, Everyone, Authenticated Users.
          $wide = 'BUILTIN\\Users|\bEveryone\b|Authenticated Users|S-1-5-32-545(?!\d)|S-1-1-0(?!\d)|S-1-5-11(?!\d)'
          function Assert-AdminOnly([string] $path, [bool] $isDir) {
            $acl = (icacls $path | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "icacls '$path' failed ($LASTEXITCODE)" }
            Write-Host $acl
            if ($acl -match $wide) { throw "'$path' grants a wide principal ($($Matches[0])) — the access key would be readable by local users" }
            if ($acl -notmatch 'NT AUTHORITY\\SYSTEM:' -or $acl -notmatch 'BUILTIN\\Administrators:') { throw "'$path' lacks the SYSTEM / Administrators ACE" }
            if ($isDir) {
              # The owner keeps an implicit WRITE_DAC, so it must not be a regular user.
              $owner = (Get-Acl -Path $path).Owner
              Write-Host "owner: $owner"
              if ($owner -notin @('BUILTIN\Administrators', 'NT AUTHORITY\SYSTEM')) { throw "'$path' is owned by '$owner', expected BUILTIN\Administrators" }
              if ($acl -match '\(I\)') { throw "'$path' still inherits ACEs — inheritance from the parent must be disabled" }
              if ($acl -notmatch 'NT AUTHORITY\\SYSTEM:\(OI\)\(CI\)\(F\)' -or $acl -notmatch 'BUILTIN\\Administrators:\(OI\)\(CI\)\(F\)') {
                throw "'$path' must grant SYSTEM and Administrators (OI)(CI)(F)"
              }
            }
          }

          $dataDir = Join-Path $env:ProgramData 'HSM Agent'
          $config = Join-Path $dataDir 'config.json'
          $legacyConfig = '{ "server": { "address": "https://127.0.0.1", "port": 65530, "accessKey": "legacy-1279" } }'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -Path $config -Value $legacyConfig -Encoding ascii -NoNewline
          $legacyAcl = (icacls $config | Out-String)
          Write-Host "pre-#1279 config ACL:`n$legacyAcl"
          if ($legacyAcl -notmatch $wide) { throw "setup: the seeded config.json should inherit a wide ACE from %ProgramData%, else the upgrade check is vacuous" }
          # A dir pre-created by someone else keeps its owner's implicit WRITE_DAC; NETWORK SERVICE stands
          # in for that non-admin owner, which --install must replace with Administrators.
          icacls $dataDir /setowner '*S-1-5-20' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "setup: could not seed a non-admin owner on the data dir" }

          & $exe --install
          if ($LASTEXITCODE -ne 0) { throw "--install failed ($LASTEXITCODE)" }
          $qc = (sc.exe qc HSMAgent | Out-String)
          Write-Host $qc
          if ($qc -notmatch 'AUTO_START') { throw "service is not auto-start" }

          Assert-AdminOnly $dataDir $true
          Assert-AdminOnly (Join-Path $dataDir 'logs') $true
          Assert-AdminOnly $config $false
          if ((Get-Content -Raw -Path $config) -ne $legacyConfig) { throw "the existing config.json changed while its ACL was tightened" }

          '{ "server": { "address": "https://127.0.0.1", "port": 65530, "accessKey": "smoke" }, "periods": { "collectMs": 1000 } }' |
            Out-File -Encoding ascii cfg.json
          $p = Start-Process -FilePath $exe -ArgumentList '--console','--config','cfg.json' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "console run exited early (exit $($p.ExitCode)) — should survive an unreachable server" }
          Stop-Process -Id $p.Id -Force

          # The console run re-applied the DACL (idempotent, as on every service start) and wrote its log.
          Assert-AdminOnly $dataDir $true
          Assert-AdminOnly (Join-Path $dataDir 'logs\hsm-agent.log') $false

          & $exe --uninstall
          if ($LASTEXITCODE -ne 0) { throw "--uninstall failed ($LASTEXITCODE)" }
          Write-Host "service install + console-resilience + uninstall smoke ok"

      - name: Stage bundle payload
        shell: bash
        run: |
          mkdir -p staging
          exe=$(find build/agent -name 'hsm-agent.exe' -type f | head -1)
          echo "agent exe: $exe"
          cp "$exe" staging/hsm-agent.exe
          cp src/agent/config.template.json staging/config.json
          cp src/agent/packaging/install-hsmagent-service.cmd staging/install-hsmagent-service.cmd
          cp src/agent/packaging/uninstall-hsmagent-service.cmd staging/uninstall-hsmagent-service.cmd
          # version.txt consumed by GET /api/agent/version on the server (epic #1174).
          grep 'project(HsmAgent VERSION' src/agent/CMakeLists.txt \
            | sed 's/.*VERSION \([0-9][^ )]*\).*/\1/' > staging/version.txt
          cat staging/version.txt
          ls -l staging

      - name: Upload agent bundle
        uses: actions/upload-artifact@v4
        with:
          name: hsm-agent-windows
          path: staging
          if-no-files-found: error
