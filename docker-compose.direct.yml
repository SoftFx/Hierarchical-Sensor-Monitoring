# HSM Server WITHOUT Caddy: HSM serves HTTPS itself with its own certificate (self-signed by
# default, or your .pfx in Config/, see the wiki page Server-Configuration). Same data folders as
# docker-compose.yml, so you can switch between the two in both directions:
#   docker compose down                                 # stop the Caddy stack
#   docker compose -f docker-compose.direct.yml up -d   # start HSM alone
# and back:
#   docker compose -f docker-compose.direct.yml down
#   docker compose up -d
# Everything is served on the single port 443 (Web UI + Sensor API, #1590). The 44330/44333
# mappings are deprecated aliases kept through the deprecation window for clients still
# pointed at the old two-port scheme; the follow-up release removes them.
# Health comes from the image itself (#1465), so `docker ps` shows starting/healthy/unhealthy here
# too: see docker_scripts/HSMserver/Dockerfile.healthcheck.
services:
  app:
    image: 'hsmonitoring/hierarchical_sensor_monitoring:latest'
    container_name: hsm-server
    restart: unless-stopped
    user: '0'
    ports:
      - '443:443'       # single port — Web UI + Sensor API (https)
      # Deprecated aliases (#1590), removed with the follow-up release.
      - '44330:443'
      - '44333:443'
    volumes:
      - ./Logs:/app/Logs                       # NLog output
      - ./Config:/app/Config                   # server config (TLS cert, Telegram, Agent settings)
      - ./Databases:/app/Databases             # embedded LevelDB (sensor history + metadata)
      - ./DatabasesBackups:/app/DatabasesBackups
